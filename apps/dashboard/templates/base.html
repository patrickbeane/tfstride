<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&display=swap"
    >
    <link rel="stylesheet" href="{{ request.url_for('static', path='dashboard.css') }}">
    {% block page_styles %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ request.url_for('index') }}">
          <span class="wordmark-mark">TFS</span>
          <span class="wordmark-text">tfSTRIDE</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ request.url_for('index') }}"{% if request.url.path in ('/', '/analyze') %} aria-current="page"{% endif %}>Upload</a>
          <a href="{{ request.url_for('scenarios_page') }}"{% if request.url.path == '/scenarios' or request.url.path.startswith('/demo/') %} aria-current="page"{% endif %}>Demos</a>
          <a href="{{ request.url_for('healthz') }}">Health</a>
          <a href="{{ request.url_for('api_docs') }}">API Docs</a>
        </nav>
      </header>
      <main class="page-main" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      <footer class="site-footer">
        <span>Open source on </span>
        <a href="https://github.com/patrickbeane/tfstride" target="_blank" rel="noreferrer">GitHub</a>
      </footer>
    </div>
    {% block page_scripts %}{% endblock %}
  </body>
</html>
