  "src/tfstride/providers/gcp/resource_decorator.py",
  "src/tfstride/providers/azure/plugin.py",
  "src/tfstride/providers/azure/normalizer.py",
  "src/tfstride/providers/azure/resource_decorator.py",

  # Provider resource facts bases.
  "src/tfstride/providers/aws/resource_facts/base.py",
  "src/tfstride/providers/azure/resource_facts/base.py",
  "src/tfstride/providers/gcp/resource_facts/base.py",

