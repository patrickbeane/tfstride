extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
failOnWarnings = true
reportMissingTypeArgument = "error"
reportUnknownMemberType = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # Keep the first lint pass focused on correctness and import hygiene. Existing
  # long test fixtures and explanatory strings can be wrapped separately.
  "E501",
  # FastAPI intentionally uses File()/Form() in endpoint parameter defaults.
  "B008",
  # StrEnum migration is safe on Python 3.11+, but it is not needed for the
  # initial lint gate.
  "UP042",
]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 100
sort_by_size = true