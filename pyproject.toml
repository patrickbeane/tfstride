[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfstride"
version = "0.4.40"
description = "Deterministic cloud threat modeling for Terraform plan JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Patrick" }
]
dependencies = []

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=8,<10",
  "basedpyright==1.39.9",
  "ruff>=0.5,<1",
  "vulture>=2.16,<3",
]

[project.scripts]
tfstride = "tfstride.cli:main"

[tool.basedpyright]
include = [
  # Shared provider and metadata contracts.
  "src/tfstride/providers/base.py",
  "src/tfstride/providers/plugin.py",
  "src/tfstride/providers/contracts.py",
  "src/tfstride/providers/decoration.py",
  "src/tfstride/providers/metadata_ownership.py",
  "src/tfstride/providers/normalization.py",
  "src/tfstride/providers/resource_facts.py",
  "src/tfstride/providers/resource_reference_index.py",
  "src/tfstride/resource_metadata.py",

  # Shared dependency-resolution contracts.
  "src/tfstride/dependencies/resolution.py",

  # Shared storage posture contracts.
  "src/tfstride/storage/versioning.py",

  # Shared managed-key lifecycle contracts.
  "src/tfstride/key_management/lifecycle.py",

  # Shared analysis contracts.
  "src/tfstride/analysis/indexes.py",
  "src/tfstride/analysis/boundaries/types.py",
  "src/tfstride/analysis/rule_definitions.py",
  "src/tfstride/analysis/privileged_assignment_evaluator.py",

  # Terraform plan configuration-reference resolution.
  "src/tfstride/input/configuration_references.py",

  # Provider symbolic relationship resolution.
  "src/tfstride/providers/aws/resource_decoration/symbolic_relationships.py",
  "src/tfstride/providers/gcp/resource_decoration/symbolic_relationships.py",
  "src/tfstride/providers/azure/resource_decoration/symbolic_relationships.py",
  "src/tfstride/providers/azure/resource_decoration/network_symbolic_relationships.py",

